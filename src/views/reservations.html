<section class="reservations-view" id="reservations-view">
  <header class="reservations-view__header">
    <h1 class="reservations-view__title">Mes Réservations</h1>
  </header>

  <div class="reservations-view__content">
    <article class="reservations-card reservations-card--highlight">
      <p class="reservations-card__eyebrow">
        <span class="reservations-card__eyebrow-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="2"></circle>
            <path d="M12 7.5V12L15 13.8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </span>
        <span>Ton prochain tour dans</span>
      </p>

      <div class="reservations-countdown">
        <span class="reservations-countdown__value" id="reservations-countdown-value">10:30</span>
        <span class="reservations-countdown__unit">heures</span>
      </div>

      <p class="reservations-card__meta" id="reservations-next-info">
        Jeudi 20 Mars, 14:00 - Machine L1
      </p>
    </article>

    <article class="reservations-card">
      <div class="reservations-card__header">
        <h2 class="reservations-card__title">Réserver un tour</h2>
        <span class="reservations-card__subtitle" id="reservations-calendar-month"></span>
      </div>

      <div class="reservations-calendar">
        <div class="reservations-calendar__weekdays" aria-hidden="true">
          <span>D</span>
          <span>L</span>
          <span>M</span>
          <span>M</span>
          <span>J</span>
          <span>V</span>
          <span>S</span>
        </div>

        <div class="reservations-calendar__grid" id="reservations-calendar-grid"></div>
      </div>

      <div class="reservations-legend">
        <div class="reservations-legend__item">
          <span class="reservations-legend__dot reservations-legend__dot--recommended"></span>
          <span>Créneau recommandé</span>
        </div>

        <div class="reservations-legend__item">
          <span class="reservations-legend__dot reservations-legend__dot--unavailable"></span>
          <span>Pas de créneaux disponibles</span>
        </div>
      </div>
    </article>

    <article class="reservations-card">
      <div class="reservations-card__header">
        <h2 class="reservations-card__title">Demande par jour</h2>
        <span class="reservations-card__subtitle" id="reservations-demand-range"></span>
      </div>

      <div class="reservations-demand" id="reservations-demand-chart"></div>

      <div class="reservations-legend">
        <div class="reservations-legend__item">
          <span class="reservations-legend__dot reservations-legend__dot--recommended"></span>
          <span>Jour de plus forte demande</span>
        </div>
      </div>
    </article>

    <article class="reservations-card">
      <div class="reservations-card__header">
        <h2 class="reservations-card__title">Historique</h2>
      </div>

      <div class="reservations-history" id="reservations-history-list"></div>
    </article>
  </div>
</section>
