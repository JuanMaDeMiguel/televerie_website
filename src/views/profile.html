<div class="profile-wrapper">
    <div id="profile-main" class="profile-view">
        <header class="profile-header">
            <div class="profile-header__titles">
                <span class="profile-header__subtitle">MON COMPTE</span>
                <h1 class="profile-header__title">Profil</h1>
            </div>
            <button class="profile-header__bell">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
            </button>
        </header>

        <section class="profile-user">
            <div class="profile-user__avatar-wrapper">
                <img id="user-avatar" src="" alt="Avatar" class="profile-user__avatar">
            </div>
            <div class="profile-user__details">
                <div id="user-name" class="profile-user__field profile-user__field--bold"></div>
                <div id="user-email" class="profile-user__field"></div>
                <div id="user-phone" class="profile-user__field"></div>
            </div>
        </section>

        <nav class="profile-menu">
            <button class="profile-menu__item" id="btn-donnees"><span>Données personnelles</span> <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><path d="M9 18l6-6-6-6"/></svg></button>
            <button class="profile-menu__item" id="btn-paiement"><span>Moyens de paiement</span> <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><path d="M9 18l6-6-6-6"/></svg></button>
            <button class="profile-menu__item" id="btn-historique"><span>Historique des réservations</span> <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><path d="M9 18l6-6-6-6"/></svg></button>
            <button class="profile-menu__item"><span>Notifications</span> <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><path d="M9 18l6-6-6-6"/></svg></button>
            <button class="profile-menu__item"><span>Paramètres de l'application</span> <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><path d="M9 18l6-6-6-6"/></svg></button>
            <button class="profile-menu__item"><span>Aide & Support</span> <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><path d="M9 18l6-6-6-6"/></svg></button>
        </nav>

        <div class="profile-logout-wrapper">
            <button class="profile-logout" id="btn-logout">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                Se déconnecter
            </button>
        </div>
    </div>

    <div id="panel-donnees" class="profile-view profile-view--hidden">
        <header class="profile-sub-header">
            <button class="profile-back-btn" data-back="panel-donnees">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <h1 class="profile-header__title">Données personnelles</h1>
        </header>
        <div class="profile-content" id="data-donnees-container"></div>
    </div>

    <div id="panel-paiement" class="profile-view profile-view--hidden">
        <header class="profile-sub-header">
            <button class="profile-back-btn" data-back="panel-paiement">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <h1 class="profile-header__title">Moyens de paiement</h1>
        </header>
        <div class="profile-content" id="data-paiement-container"></div>
    </div>

    <div id="panel-historique" class="profile-view profile-view--hidden">
        <header class="profile-sub-header">
            <button class="profile-back-btn" data-back="panel-historique">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <h1 class="profile-header__title">Historique</h1>
        </header>
        <div class="profile-content" id="data-historique-container"></div>
    </div>
</div>
