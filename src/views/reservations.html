<section class="reservations-view" id="reservations-view">
  <header class="reservations-header">
    <h1>Mes Réservations</h1>
  </header>

  <div class="reservations-content">
    <article class="reservations-card reservations-card--highlight">
      <p class="reservations-card-label">
        <span class="reservations-card-label-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="2"></circle>
            <path d="M12 7.5V12L15 13.8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </span>
        Ton prochain tour dans
      </p>

      <div class="reservations-countdown-row">
        <span class="reservations-countdown-value" id="reservations-countdown-value">10:30</span>
        <span class="reservations-countdown-unit">heures</span>
      </div>

      <p class="reservations-next-info" id="reservations-next-info">
        Jeudi 20 Mars, 14:00 - Machine L1
      </p>
    </article>

    <article class="reservations-card">
      <div class="reservations-card-head">
        <h2>Réserver un tour</h2>
        <span class="reservations-card-subtitle" id="reservations-calendar-month"></span>
      </div>

      <div class="reservations-weekdays" aria-hidden="true">
        <span>D</span>
        <span>L</span>
        <span>M</span>
        <span>M</span>
        <span>J</span>
        <span>V</span>
        <span>S</span>
      </div>

      <div class="reservations-calendar-grid" id="reservations-calendar-grid"></div>

      <div class="reservations-legend">
        <div class="reservations-legend-item">
          <span class="reservations-legend-dot reservations-legend-dot--recommended"></span>
          <span>Créneau recommandé</span>
        </div>

        <div class="reservations-legend-item">
          <span class="reservations-legend-dot reservations-legend-dot--unavailable"></span>
          <span>Pas de créneaux disponibles</span>
        </div>
      </div>
    </article>

    <article class="reservations-card">
      <div class="reservations-card-head">
        <h2>Demande par jour</h2>
        <span class="reservations-card-subtitle" id="reservations-demand-range"></span>
      </div>

      <div class="reservations-demand-chart" id="reservations-demand-chart"></div>

      <div class="reservations-legend">
        <div class="reservations-legend-item">
          <span class="reservations-legend-dot reservations-legend-dot--recommended"></span>
          <span>Jour de plus forte demande</span>
        </div>
      </div>
    </article>

    <article class="reservations-card">
      <div class="reservations-card-head">
        <h2>Historique</h2>
      </div>

      <div class="reservations-history-list" id="reservations-history-list"></div>
    </article>
  </div>
</section>
